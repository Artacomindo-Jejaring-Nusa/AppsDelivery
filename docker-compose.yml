services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery-api
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - barcode_images:/app/uploads/barcodes
    networks:
      - delivery-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: delivery-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_secret_2026
      POSTGRES_DB: delivery_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: delivery-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_secret_2026
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - delivery-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  barcode_images:

networks:
  delivery-network:
    driver: bridge
